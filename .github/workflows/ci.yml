name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bench:
    name: Self-benchmark (localization accuracy gate)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e .

      - name: Demo runs clean (no keys, deterministic)
        run: sentinel demo

      - name: Localization accuracy gate
        run: sentinel bench --fail-under 0.8
